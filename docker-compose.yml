# Local Postgres for the Personal OS (ADR-002).
#
# Nothing is installed system-wide. Removing this project means:
#   docker compose down -v && rm -rf pgdata/
#
# Credentials come from .env, which is gitignored (Plan.md §22). Copy .env.example
# to .env before the first `docker compose up -d`.

services:
  db:
    image: postgres:17
    container_name: personal-os-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host port 5433, not 5432, so this cannot collide with any other Postgres
      # already running on this machine.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      # The API's startup check depends on this: a daily-use local tool must fail
      # with "the database container isn't running", not a connection stack trace.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
